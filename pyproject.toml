[project]
name = "temporal-demo-task-queue-fairness"
version = "0.1.0"
description = "Temporal Task Queue Fairness demo: one tenant's bulk upload versus everyone else's documents."
requires-python = ">=3.11"
dependencies = [
    "temporalio==1.34.0",
    "temporal-agent-harness==0.7.0",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fairness_demo"]
